name: Deploy iumrah backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iumrah-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy iumrah backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Backend/IumrahBackend
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEW_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.NEW_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      # Exact existing names; script looks up UUIDs automatically. No D1 secrets.
      HOTELS_DB_NAME: iumrah-hotels
      BOOKINGS_DB_NAME: iumrah-core
      FLIGHTS_DB_NAME: iumrah-flights
      # Production routes and scheduled actions remain untouched.
      IUMRAH_ENABLE_ROUTE_CUTOVER: '0'
      IUMRAH_ENABLE_SCHEDULED_JOBS: '0'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BOT_INGEST_TOKEN: ${{ secrets.FLIGHT_HUB_BOT_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.FLIGHT_HUB_ADMIN_TOKEN }}
      IGNAV_INGEST_TOKEN: ${{ secrets.FLIGHT_HUB_IGNAV_TOKEN }}
      AERODATABOX_INGEST_TOKEN: ${{ secrets.FLIGHT_HUB_AERODATABOX_TOKEN }}
      AERODATABOX_RAPIDAPI_KEY: ${{ secrets.AERODATABOX_RAPIDAPI_KEY }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      ESIM_ACCESS_CODE: ${{ secrets.ESIM_ACCESS_CODE }}
      ESIM_ACCESS_SECRET: ${{ secrets.ESIM_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install hotel module dependencies
        run: npm install --prefix ../HotelsWorker --no-audit --no-fund
      - name: Test backend
        run: npm run check
      - name: Find existing Cloudflare databases and storage
        run: node scripts/discover-bindings.mjs >> "$GITHUB_ENV"
      - name: Check connected resources (warnings do not block staging)
        run: npm run preflight
      - name: Generate unified Worker config
        run: npm run render
      - name: Verify build
        run: npm run dry-run
      - name: Deploy iumrah backend
        run: npm run deploy
      - name: Sync already configured API keys
        shell: bash
        run: |
          set -euo pipefail
          for key in GEMINI_API_KEY BOT_INGEST_TOKEN ADMIN_TOKEN IGNAV_INGEST_TOKEN \
            AERODATABOX_INGEST_TOKEN AERODATABOX_RAPIDAPI_KEY APNS_KEY_ID \
            APNS_PRIVATE_KEY ESIM_ACCESS_CODE ESIM_ACCESS_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              printf '%s' "${!key}" | npx wrangler secret put "$key" --config wrangler.generated.jsonc >/dev/null
              echo "Key available: $key"
            fi
          done
      - name: Result
        run: |
          echo 'Published Worker: iumrah-backend'
          echo 'Preview URL: https://iumrah-backend.<your-account>.workers.dev'
          echo 'This is ONE deployment: no extra validate/stage choice.'
          echo 'Existing production Worker routes and crons were not changed.'
          echo 'Check /__iumrah/health before moving any client traffic.'
