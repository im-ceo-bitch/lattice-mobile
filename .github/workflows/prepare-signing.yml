name: Prepare new iumrah Root Apple signing requests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-request:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Verify GitHub secrets for new Apple Developer account
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID_EMAIL" || { echo 'Missing secret APPLE_ID_EMAIL'; exit 1; }
          test -n "$IOS_SIGNING_KEY_PASSWORD" || { echo 'Missing secret IOS_SIGNING_KEY_PASSWORD'; exit 1; }

      - name: Generate fresh Apple Distribution and Mac Installer CSRs
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing-output

          openssl genrsa -out "$RUNNER_TEMP/root-distribution-private-key.pem" 2048
          openssl req -new -sha256 \
            -key "$RUNNER_TEMP/root-distribution-private-key.pem" \
            -out signing-output/iumrah-root-distribution.certSigningRequest \
            -subj "/emailAddress=${APPLE_ID_EMAIL}/CN=iumrah Root Distribution/C=UZ"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/root-distribution-private-key.pem" \
            -out signing-output/root-distribution-private-key.enc \
            -pass env:IOS_SIGNING_KEY_PASSWORD

          openssl genrsa -out "$RUNNER_TEMP/root-mac-installer-private-key.pem" 2048
          openssl req -new -sha256 \
            -key "$RUNNER_TEMP/root-mac-installer-private-key.pem" \
            -out signing-output/iumrah-root-mac-installer.certSigningRequest \
            -subj "/emailAddress=${APPLE_ID_EMAIL}/CN=iumrah Root Mac Installer/C=UZ"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/root-mac-installer-private-key.pem" \
            -out signing-output/root-mac-installer-private-key.enc \
            -pass env:IOS_SIGNING_KEY_PASSWORD
          rm -f "$RUNNER_TEMP/root-distribution-private-key.pem" "$RUNNER_TEMP/root-mac-installer-private-key.pem"

      - name: Write signing instructions
        run: |
          cat > signing-output/NEXT-STEPS.txt <<'TXT'
          IUMRAH ROOT / NEW APPLE DEVELOPER TEAM

          1. Apple Developer > Certificates: upload
             iumrah-root-distribution.certSigningRequest (Apple Distribution).
          2. Enable Push Notifications for App ID com.iumrah.root.
          3. Create an App Store Connect iOS distribution profile for this
             App ID with the NEW Apple Distribution certificate. Save its raw
             bytes as iumrah-root.mobileprovision.
          4. For Mac Catalyst, upload
             iumrah-root-mac-installer.certSigningRequest as a Mac Installer
             Distribution certificate. Download as iumrah-root-mac-installer.cer.
          5. Create Mac App Store Connect provisioning profile for
             com.iumrah.root using the SAME Apple Distribution certificate
             as step 3. Save as iumrah-root-mac.provisionprofile.
          6. Add the five raw files as base64 GitHub Actions secrets:
             ROOT_DISTRIBUTION_KEY_B64 (root-distribution-private-key.enc)
             ROOT_IOS_PROFILE_B64 (iumrah-root.mobileprovision)
             ROOT_MAC_INSTALLER_KEY_B64 (root-mac-installer-private-key.enc)
             ROOT_MAC_INSTALLER_CERT_B64 (iumrah-root-mac-installer.cer)
             ROOT_MAC_PROFILE_B64 (iumrah-root-mac.provisionprofile)
          7. Do NOT commit these files. Set APPLE_TEAM_ID to the NEW team.
          8. See APPLE_ROOT_SETUP_RU.md for full instructions.

          IMPORTANT: This run generates NEW private keys. Keep the downloaded
          artifact safe. Never regenerate without replacing all associated
          certificates and profiles.
          TXT

      - name: Upload encrypted private keys and CSR bundle
        uses: actions/upload-artifact@v4
        with:
          name: iumrah-root-new-team-signing-requests
          path: signing-output/
          retention-days: 7
