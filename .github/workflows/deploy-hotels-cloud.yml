# Same EXISTING workflow file, repurposed as a safe D1-only preparation stage.
# This file MUST replace .github/workflows/deploy-hotels-cloud.yml once.
# The current ZIP applier deliberately skips .github/workflows/.
name: Deploy iumrah Cloud (D1 only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iumrah-cloudflare-d1-preparation
  cancel-in-progress: false

jobs:
  deploy:
    name: Prepare new Cloudflare D1 (no R2 or production changes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Use NEW_ secrets if they exist. Existing CLOUDFLARE_* also works if
      # they were intentionally updated to point to the new account.
      CLOUDFLARE_API_TOKEN: ${{ secrets.NEW_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEW_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate new Cloudflare D1 deployment code
        run: node --test Backend/CloudflareD1Deploy/tests/prepare.test.mjs

      - name: Verify Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing Cloudflare Account ID'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing Cloudflare API token'; exit 1; }

      - name: Verify target account and prepare iumrah-core D1
        run: node Backend/CloudflareD1Deploy/prepare.mjs

      - name: Apply flight D1 schema (non-destructive)
        run: >-
          npx --yes wrangler@4.107.0 d1 execute iumrah-flights --remote
          --file=Backend/FlightHubWorker/migrations/0001_flight_hub.sql

      - name: Verify flight schema
        run: >-
          npx --yes wrangler@4.107.0 d1 execute iumrah-flights --remote
          --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('flights','flight_offers','price_history','monitor_runs','unmatched_observations') ORDER BY name;"

      - name: Migration status
        if: success()
        run: |
          echo 'D1 preparation succeeded. No bookings, users or old flight offers have been copied yet.'
          echo 'Original Worker routes, hotel provider and R2 are unchanged.'
