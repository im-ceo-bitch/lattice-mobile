name: Provision new Cloudflare Flight Hub (manual)

on:
  schedule:
    - cron: '0 3,15 * * *' # 08:00 and 20:00 Asia/Tashkent; may be delayed by GitHub
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy D1/Worker, check airlines, or seed existing flight identities'
        required: true
        type: choice
        options:
          - deploy
          - monitor
          - seed
        default: deploy

permissions:
  contents: read

concurrency:
  group: iumrah-flight-hub-${{ github.event_name }}-${{ inputs.action || 'daily' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Backend/FlightHubWorker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FLIGHT_HUB_IGNAV_TOKEN: ${{ secrets.FLIGHT_HUB_IGNAV_TOKEN }}
      FLIGHT_HUB_AERODATABOX_TOKEN: ${{ secrets.FLIGHT_HUB_AERODATABOX_TOKEN }}
      AERODATABOX_RAPIDAPI_KEY: ${{ secrets.AERODATABOX_RAPIDAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new Cloudflare credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
      - name: Test backend
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Derive internal service credentials
        run: node scripts/write-ci-service-keys.mjs
      - name: Find or create independent Flight Hub D1
        id: provision
        run: node scripts/provision-new-account.mjs
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply FLIGHTS_DB --remote --config wrangler.generated.toml
      - name: Deploy Flight Hub Worker
        run: npx wrangler deploy --config wrangler.generated.toml
      - name: Configure Worker authorization
        run: |
          set -euo pipefail
          printf '%s' "$FLIGHT_HUB_BOT_TOKEN" | npx wrangler secret put BOT_INGEST_TOKEN --config wrangler.generated.toml
          printf '%s' "$FLIGHT_HUB_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config wrangler.generated.toml
          if test -n "$FLIGHT_HUB_IGNAV_TOKEN"; then printf '%s' "$FLIGHT_HUB_IGNAV_TOKEN" | npx wrangler secret put IGNAV_INGEST_TOKEN --config wrangler.generated.toml; fi
          if test -n "$FLIGHT_HUB_AERODATABOX_TOKEN"; then printf '%s' "$FLIGHT_HUB_AERODATABOX_TOKEN" | npx wrangler secret put AERODATABOX_INGEST_TOKEN --config wrangler.generated.toml; fi
          if test -n "$AERODATABOX_RAPIDAPI_KEY"; then printf '%s' "$AERODATABOX_RAPIDAPI_KEY" | npx wrangler secret put AERODATABOX_RAPIDAPI_KEY --config wrangler.generated.toml; fi
      - name: Resolve public Worker endpoint
        run: node scripts/find-worker-url.mjs
      - name: Check public Worker endpoint
        run: |
          node -e 'fetch(process.env.FLIGHT_HUB_URL+"/health").then(r=>r.json()).then(j=>{if(!j.ok||!j.database_connected)process.exit(1);console.log("Worker and D1: OK")}).catch(e=>{console.error(e);process.exit(1)})'
      - name: Print integration address (no credentials)
        run: echo "Flight Hub URL $FLIGHT_HUB_URL"

  monitor:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'monitor')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [centrum, uzbekistan, flynas]
    defaults:
      run:
        working-directory: Backend/AirlineMonitors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Worker URL and authorization
        working-directory: Backend/FlightHubWorker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/write-ci-service-keys.mjs
          node scripts/find-worker-url.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify existing airline fares (no CAPTCHA bypass)
        run: python -m monitor.cli --provider '${{ matrix.provider }}' --limit 20
      - name: Save redacted diagnostics for site changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airline-${{ matrix.provider }}-${{ github.run_number }}
          path: Backend/AirlineMonitors/output/${{ matrix.provider }}/
          retention-days: 7
          if-no-files-found: ignore

  seed:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'seed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.OLD_CLOUDFLARE_ACCOUNT_ID }}
      OLD_CLOUDFLARE_API_TOKEN: ${{ secrets.OLD_CLOUDFLARE_API_TOKEN }}
      NEW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: Backend/FlightHubWorker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve public Flight Hub URL
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/find-worker-url.mjs
      - name: Import only active existing flight identities
        run: node scripts/seed-from-old-d1.mjs --push
