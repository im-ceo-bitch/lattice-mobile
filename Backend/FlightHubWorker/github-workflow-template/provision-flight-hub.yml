name: Provision new Cloudflare Flight Hub (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend/FlightHubWorker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NEW_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.NEW_CLOUDFLARE_API_TOKEN }}
      FLIGHT_HUB_IGNAV_TOKEN: ${{ secrets.FLIGHT_HUB_IGNAV_TOKEN }}
      FLIGHT_HUB_AERODATABOX_TOKEN: ${{ secrets.FLIGHT_HUB_AERODATABOX_TOKEN }}
      AERODATABOX_RAPIDAPI_KEY: ${{ secrets.AERODATABOX_RAPIDAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'NEW_CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'NEW_CLOUDFLARE_API_TOKEN missing'; exit 1; }
      - name: Install and test
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Derive service authorization (no additional GitHub Secrets)
        run: node scripts/write-ci-service-keys.mjs
      - name: Find/create two independent D1 databases in the NEW account
        id: provision
        run: node scripts/provision-new-account.mjs
      - name: Apply remote schema only to new D1
        run: npx wrangler d1 migrations apply FLIGHTS_DB --remote --config wrangler.generated.toml
      - name: Deploy Worker to workers.dev in new account
        run: npx wrangler deploy --config wrangler.generated.toml
      - name: Set Worker secrets in new account
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FLIGHT_HUB_BOT_TOKEN" | npx wrangler secret put BOT_INGEST_TOKEN --config wrangler.generated.toml
          printf '%s' "$FLIGHT_HUB_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config wrangler.generated.toml
          if test -n "$FLIGHT_HUB_IGNAV_TOKEN"; then printf '%s' "$FLIGHT_HUB_IGNAV_TOKEN" | npx wrangler secret put IGNAV_INGEST_TOKEN --config wrangler.generated.toml; fi
          if test -n "$FLIGHT_HUB_AERODATABOX_TOKEN"; then printf '%s' "$FLIGHT_HUB_AERODATABOX_TOKEN" | npx wrangler secret put AERODATABOX_INGEST_TOKEN --config wrangler.generated.toml; fi
          if test -n "$AERODATABOX_RAPIDAPI_KEY"; then printf '%s' "$AERODATABOX_RAPIDAPI_KEY" | npx wrangler secret put AERODATABOX_RAPIDAPI_KEY --config wrangler.generated.toml; fi
      - name: Resolve new Worker URL
        run: node scripts/find-worker-url.mjs
      - name: Check new Worker health
        run: |
          node -e 'fetch(process.env.FLIGHT_HUB_URL+"/health").then(r=>r.json()).then(j=>{if(!j.ok||!j.database_connected)process.exit(1);console.log("Flight Hub health: OK")}).catch(e=>{console.error(e);process.exit(1)})'
      - name: Output provisioning result
        run: |
          echo "New FLIGHTS_DB UUID: ${{ steps.provision.outputs.database_id }}"
          echo "New CORE DB UUID (empty until private data migration): ${{ steps.provision.outputs.core_database_id }}"
          echo "New Worker URL: $FLIGHT_HUB_URL"
          echo 'Do NOT change iumrah.app routing or PLATFORM API yet.'
